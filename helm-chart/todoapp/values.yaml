# General
namespace: todoapp
image:
  repository: nginx
  tag: "1.24"
replicaCount: 2

# ServiceAccount
serviceAccount:
  create: true
  name: todoapp-sa

# Secrets — map of key->value; will be populated via range into Secret data
secrets:
  DB_USER: user
  DB_PASS: secretpass

# Resources for deployment
resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "500m"

# Rolling update parameters
rollingUpdate:
  maxUnavailable: 1
  maxSurge: 1

# Node affinity parameters (deployment)
nodeAffinity:
  key: "kubernetes.io/hostname"
  values:
    - "worker"  # you can change to match your node labels

# HPA config
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50
  targetMemoryUtilizationPercentage: 70

# PV / PVC
pv:
  name: todoapp-pv
  storageClassName: ""
  capacity: "1Gi"
pvc:
  accessModes:
    - ReadWriteOnce
  requests:
    storage: "1Gi"

# Deployment image pull policy
imagePullPolicy: IfNotPresent
