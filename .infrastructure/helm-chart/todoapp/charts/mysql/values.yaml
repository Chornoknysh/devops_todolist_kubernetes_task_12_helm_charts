namespace: todoapp
image:
  repository: mysql
  tag: "8.0"
replicaCount: 1
service:
  port: 3306

# secrets for mysql (range to populate)
secrets:
  mysql-root-password: rootpass
  mysql-user: todo
  mysql-password: todopass
  mysql-database: tododb

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"

pvc:
  requests:
    storage: "2Gi"

affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - mysql

tolerations:
  - key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"
